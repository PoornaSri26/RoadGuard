<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="stepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="36" font-size="16" font-weight="bold" fill="#f59e0b">ROADGUARD AI ARCHITECTURE &amp; DATA PIPELINE</text>

  <!-- Step 1 -->
  <g transform="translate(40, 60)" filter="url(#shadow)">
    <rect width="210" height="140" rx="12" fill="url(#stepGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#3b82f622"/>
    <text x="24" y="37" font-size="18">📸</text>
    <text x="56" y="36" font-size="14" font-weight="bold" fill="#ffffff">1. Ingestion</text>
    <text x="16" y="70" font-size="11" fill="#cbd5e1">• Geo-tagged photo uploads</text>
    <text x="16" y="90" font-size="11" fill="#cbd5e1">• GPS accuracy validation</text>
    <text x="16" y="110" font-size="11" fill="#cbd5e1">• Exif &amp; telemetry parsing</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 265 130 L 295 130" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <polygon points="295,130 287,125 287,135" fill="#f59e0b"/>

  <!-- Step 2 -->
  <g transform="translate(310, 60)" filter="url(#shadow)">
    <rect width="210" height="140" rx="12" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#f59e0b22"/>
    <text x="24" y="37" font-size="18">🧠</text>
    <text x="56" y="36" font-size="14" font-weight="bold" fill="#ffffff">2. AI Vision</text>
    <text x="16" y="70" font-size="11" fill="#cbd5e1">• YOLOv8 defect extraction</text>
    <text x="16" y="90" font-size="11" fill="#cbd5e1">• RDD2022 taxonomy classes</text>
    <text x="16" y="110" font-size="11" fill="#cbd5e1">• Severity (1–5) estimation</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="565,130 557,125 557,135" fill="#f59e0b"/>

  <!-- Step 3 -->
  <g transform="translate(580, 60)" filter="url(#shadow)">
    <rect width="210" height="140" rx="12" fill="url(#stepGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#10b98122"/>
    <text x="24" y="37" font-size="18">🛡️</text>
    <text x="56" y="36" font-size="14" font-weight="bold" fill="#ffffff">3. Risk Scoring</text>
    <text x="16" y="70" font-size="11" fill="#cbd5e1">• Recency decay index</text>
    <text x="16" y="90" font-size="11" fill="#cbd5e1">• Crowdsource peer audit</text>
    <text x="16" y="110" font-size="11" fill="#cbd5e1">• Danger radius clustering</text>
  </g>

  <!-- Arrow 3 -->
  <polygon points="835,130 827,125 827,135" fill="#f59e0b"/>

  <!-- Step 4 -->
  <g transform="translate(850, 60)" filter="url(#shadow)">
    <rect width="210" height="140" rx="12" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#8b5cf622"/>
    <text x="24" y="37" font-size="18">🛣️</text>
    <text x="56" y="36" font-size="14" font-weight="bold" fill="#ffffff">4. Safe Route</text>
    <text x="16" y="70" font-size="11" fill="#cbd5e1">• OSRM hazard cost weighting</text>
    <text x="16" y="90" font-size="11" fill="#cbd5e1">• Pothole bypass corridors</text>
    <text x="16" y="110" font-size="11" fill="#cbd5e1">• Live turn-by-turn alerts</text>
  </g>
</svg>

