<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="areaReport" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="areaResolved" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Top Navigation -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#headerGrad)" stroke="#374151" stroke-width="1"/>
  <text x="35" y="44" font-size="24" font-weight="900" fill="#f9fafb">🛡️ RoadGuardian</text>
  <rect x="220" y="26" width="68" height="24" rx="12" fill="url(#primaryGrad)"/>
  <text x="232" y="42" font-size="12" font-weight="bold" fill="#ffffff">v2.5 AI</text>
  <text x="305" y="43" font-size="14" fill="#9ca3af">Safety Analytics & Intelligence Dashboard</text>

  <!-- Tab Bar -->
  <rect x="0" y="70" width="1200" height="52" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <text x="365" y="101" font-size="14" font-weight="600" fill="#9ca3af">📍 Hazard Map</text>
  <text x="525" y="101" font-size="14" font-weight="600" fill="#9ca3af">⚠️ Report Damage</text>
  <text x="690" y="101" font-size="14" font-weight="600" fill="#9ca3af">🛣️ Safe Navigation</text>
  <rect x="830" y="77" width="140" height="38" rx="10" fill="url(#primaryGrad)"/>
  <text x="855" y="101" font-size="14" font-weight="bold" fill="#ffffff">📊 Analytics</text>

  <!-- KPI Cards -->
  <!-- Card 1 -->
  <rect x="40" y="140" width="265" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="170" font-size="12" font-weight="600" fill="#94a3b8">TOTAL HAZARDS DETECTED</text>
  <text x="60" y="212" font-size="32" font-weight="800" fill="#3b82f6">148</text>
  <text x="60" y="235" font-size="11" font-weight="600" fill="#10b981">↗ +14% this month</text>

  <!-- Card 2 -->
  <rect x="325" y="140" width="265" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="345" y="170" font-size="12" font-weight="600" fill="#94a3b8">VERIFIED BY COMMUNITY</text>
  <text x="345" y="212" font-size="32" font-weight="800" fill="#10b981">112</text>
  <text x="345" y="235" font-size="11" font-weight="600" fill="#10b981">✓ 88% accuracy rate</text>

  <!-- Card 3 -->
  <rect x="610" y="140" width="265" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="630" y="170" font-size="12" font-weight="600" fill="#94a3b8">MUNICIPAL REPAIRED</text>
  <text x="630" y="212" font-size="32" font-weight="800" fill="#8b5cf6">89</text>
  <text x="630" y="235" font-size="11" font-weight="600" fill="#8b5cf6">Avg 18.4h resolution</text>

  <!-- Card 4 -->
  <rect x="895" y="140" width="265" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="915" y="170" font-size="12" font-weight="600" fill="#94a3b8">ACTIVE SENTINELS</text>
  <text x="915" y="212" font-size="32" font-weight="800" fill="#f59e0b">1,840</text>
  <text x="915" y="235" font-size="11" font-weight="600" fill="#f59e0b">+128 joined this week</text>

  <!-- Chart 1: Trend Area Chart -->
  <rect x="40" y="270" width="700" height="370" rx="16" fill="#111827" stroke="#374151"/>
  <text x="65" y="305" font-size="15" font-weight="bold" fill="#ffffff">Incident Velocity & Resolution Trajectory</text>
  <rect x="580" y="290" width="135" height="24" rx="6" fill="#1f2937"/>
  <text x="590" y="306" font-size="11" fill="#f59e0b">● Reports</text>
  <text x="650" y="306" font-size="11" fill="#10b981">● Resolved</text>

  <!-- Area Graph Paths -->
  <path d="M70 580 L 150 540 L 250 500 L 370 510 L 500 450 L 630 420 L 700 390 L 700 600 L 70 600 Z" fill="url(#areaReport)"/>
  <path d="M70 580 L 150 540 L 250 500 L 370 510 L 500 450 L 630 420 L 700 390" stroke="#f59e0b" stroke-width="3" fill="none"/>

  <path d="M70 590 L 150 560 L 250 530 L 370 520 L 500 480 L 630 460 L 700 430 L 700 600 L 70 600 Z" fill="url(#areaResolved)"/>
  <path d="M70 590 L 150 560 L 250 530 L 370 520 L 500 480 L 630 460 L 700 430" stroke="#10b981" stroke-width="3" fill="none"/>

  <!-- Chart 2: Damage Classification Distribution -->
  <rect x="760" y="270" width="400" height="370" rx="16" fill="#111827" stroke="#374151"/>
  <text x="785" y="305" font-size="15" font-weight="bold" fill="#ffffff">Defect Distribution</text>

  <!-- Donut Chart -->
  <g transform="translate(960, 420)">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ef4444" stroke-width="32" stroke-dasharray="210, 324"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#f97316" stroke-width="32" stroke-dasharray="140, 394" stroke-dashoffset="-210"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#eab308" stroke-width="32" stroke-dasharray="100, 434" stroke-dashoffset="-350"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#3b82f6" stroke-width="32" stroke-dasharray="60, 474" stroke-dashoffset="-450"/>
    <text x="0" y="6" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">148</text>
    <text x="0" y="24" text-anchor="middle" font-size="10" fill="#9ca3af">Defects</text>
  </g>

  <!-- Donut Legend -->
  <g transform="translate(790, 560)">
    <circle cx="10" cy="10" r="5" fill="#ef4444"/>
    <text x="22" y="14" font-size="11" fill="#cbd5e1">Pothole (42%)</text>
    <circle cx="120" cy="10" r="5" fill="#f97316"/>
    <text x="132" y="14" font-size="11" fill="#cbd5e1">Alligator (28%)</text>
    <circle cx="230" cy="10" r="5" fill="#eab308"/>
    <text x="242" y="14" font-size="11" fill="#cbd5e1">Transverse (19%)</text>
  </g>
</svg>
