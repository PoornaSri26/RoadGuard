<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#headerGrad)" stroke="#374151" stroke-width="1"/>
  <text x="35" y="44" font-size="24" font-weight="900" fill="#f9fafb">🛡️ RoadGuardian</text>
  <rect x="220" y="26" width="68" height="24" rx="12" fill="url(#primaryGrad)"/>
  <text x="232" y="42" font-size="12" font-weight="bold" fill="#ffffff">v2.5 AI</text>
  <text x="305" y="43" font-size="14" fill="#9ca3af">Live Road Hazard Sentinel Network</text>

  <!-- Right side header pills -->
  <rect x="940" y="20" width="150" height="32" rx="8" fill="#1f2937" stroke="#374151"/>
  <circle cx="958" cy="36" r="5" fill="#10b981"/>
  <text x="972" y="42" font-size="13" font-weight="600" fill="#10b981">6 Hazards Tracked</text>
  <rect x="1105" y="20" width="65" height="32" rx="8" fill="#374151"/>
  <text x="1128" y="42" font-size="16" fill="#f59e0b">☀️</text>

  <!-- Tab Bar -->
  <rect x="0" y="70" width="1200" height="52" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <!-- Active Tab: Map -->
  <rect x="340" y="77" width="140" height="38" rx="10" fill="url(#primaryGrad)"/>
  <text x="365" y="101" font-size="14" font-weight="bold" fill="#ffffff">📍 Hazard Map</text>
  <text x="525" y="101" font-size="14" font-weight="600" fill="#9ca3af">⚠️ Report Damage</text>
  <text x="690" y="101" font-size="14" font-weight="600" fill="#9ca3af">🛣️ Safe Navigation</text>
  <text x="850" y="101" font-size="14" font-weight="600" fill="#9ca3af">📊 Analytics</text>

  <!-- Toolbar -->
  <rect x="40" y="140" width="1120" height="54" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="65" y="172" font-size="14" font-weight="600" fill="#e5e7eb">Filter Damage: All Hazard Types (6)</text>
  <text x="360" y="172" font-size="14" font-weight="600" fill="#e5e7eb">Min Severity: 1+</text>
  <rect x="470" y="165" width="120" height="6" rx="3" fill="#374151"/>
  <circle cx="490" cy="168" r="8" fill="#f59e0b"/>

  <text x="780" y="172" font-size="13" fill="#9ca3af">Quick Focus:</text>
  <rect x="865" y="152" width="60" height="28" rx="6" fill="#1f2937" stroke="#4b5563"/>
  <text x="878" y="171" font-size="12" fill="#e5e7eb">Delhi</text>
  <rect x="935" y="152" width="68" height="28" rx="6" fill="#1f2937" stroke="#4b5563"/>
  <text x="946" y="171" font-size="12" fill="#e5e7eb">Mumbai</text>
  <rect x="1013" y="152" width="75" height="28" rx="6" fill="#1f2937" stroke="#4b5563"/>
  <text x="1022" y="171" font-size="12" fill="#e5e7eb">Bengaluru</text>

  <!-- Map Simulation Viewport -->
  <rect x="40" y="210" width="1120" height="430" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Map Terrain lines -->
  <path d="M40 380 Q 300 320, 600 400 T 1160 360" stroke="#334155" stroke-width="28" fill="none" opacity="0.6"/>
  <path d="M40 380 Q 300 320, 600 400 T 1160 360" stroke="#475569" stroke-width="12" fill="none"/>
  <path d="M450 210 Q 520 400, 750 640" stroke="#334155" stroke-width="20" fill="none" opacity="0.6"/>
  <path d="M450 210 Q 520 400, 750 640" stroke="#475569" stroke-width="8" fill="none"/>
  
  <!-- Danger Radar Rings -->
  <circle cx="560" cy="385" r="90" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="560" cy="385" r="45" fill="#ef4444" fill-opacity="0.2"/>

  <!-- Hazard Marker Pins -->
  <g transform="translate(560, 385)">
    <circle cx="0" cy="0" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
    <text x="-4" y="5" font-size="13" font-weight="bold" fill="#ffffff">!</text>
  </g>
  <g transform="translate(320, 340)">
    <circle cx="0" cy="0" r="14" fill="#f97316" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <g transform="translate(710, 420)">
    <circle cx="0" cy="0" r="13" fill="#eab308" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <g transform="translate(880, 350)">
    <circle cx="0" cy="0" r="15" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
  </g>
  <g transform="translate(620, 510)">
    <circle cx="0" cy="0" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Interactive Inspector Popup Card -->
  <g transform="translate(590, 270)">
    <rect width="260" height="185" rx="12" fill="#111827" stroke="#4b5563" stroke-width="1" filter="url(#glow)"/>
    <rect x="0" y="0" width="260" height="34" rx="12" fill="#1f2937"/>
    <rect x="14" y="8" width="80" height="20" rx="6" fill="#ef4444"/>
    <text x="22" y="22" font-size="11" font-weight="bold" fill="#ffffff">Pothole (D40)</text>
    <text x="14" y="56" font-size="13" font-weight="bold" fill="#ffffff">HITEC City Flyover, Hyd</text>
    <text x="14" y="74" font-size="11" fill="#9ca3af">Severity: 5/5 (Critical)</text>
    
    <rect x="14" y="88" width="232" height="42" rx="8" fill="#1f2937"/>
    <text x="24" y="105" font-size="10" fill="#9ca3af">Risk Score</text>
    <text x="24" y="122" font-size="14" font-weight="bold" fill="#ef4444">94% Risk</text>
    <text x="120" y="105" font-size="10" fill="#9ca3af">Votes</text>
    <text x="120" y="122" font-size="14" font-weight="bold" fill="#ffffff">24 Verified</text>

    <text x="14" y="152" font-size="11" font-weight="bold" fill="#10b981">✓ Verified by Municipal Sentinel</text>
  </g>

  <!-- Floating Legend in Map -->
  <g transform="translate(930, 480)">
    <rect width="210" height="145" rx="12" fill="#0f172ae6" stroke="#334155" stroke-width="1"/>
    <text x="18" y="25" font-size="12" font-weight="bold" fill="#f59e0b">HAZARD SEVERITY INDEX</text>
    <circle cx="26" cy="48" r="5" fill="#ef4444"/>
    <text x="40" y="52" font-size="11" fill="#e5e7eb">Pothole (D40)</text>
    <circle cx="26" cy="72" r="5" fill="#f97316"/>
    <text x="40" y="76" font-size="11" fill="#e5e7eb">Alligator Crack (D20)</text>
    <circle cx="26" cy="96" r="5" fill="#eab308"/>
    <text x="40" y="100" font-size="11" fill="#e5e7eb">Transverse Crack (D10)</text>
    <circle cx="26" cy="120" r="5" fill="#3b82f6"/>
    <text x="40" y="124" font-size="11" fill="#e5e7eb">Longitudinal (D00)</text>
  </g>
</svg>

