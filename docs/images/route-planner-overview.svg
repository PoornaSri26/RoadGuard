<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="safeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#headerGrad)" stroke="#374151" stroke-width="1"/>
  <text x="35" y="44" font-size="24" font-weight="900" fill="#f9fafb">🛡️ RoadGuardian</text>
  <rect x="220" y="26" width="68" height="24" rx="12" fill="url(#primaryGrad)"/>
  <text x="232" y="42" font-size="12" font-weight="bold" fill="#ffffff">v2.5 AI</text>
  <text x="305" y="43" font-size="14" fill="#9ca3af">Intelligent Safe Corridor Routing</text>

  <!-- Tab Bar -->
  <rect x="0" y="70" width="1200" height="52" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <text x="365" y="101" font-size="14" font-weight="600" fill="#9ca3af">📍 Hazard Map</text>
  <text x="525" y="101" font-size="14" font-weight="600" fill="#9ca3af">⚠️ Report Damage</text>
  <rect x="670" y="77" width="160" height="38" rx="10" fill="url(#primaryGrad)"/>
  <text x="688" y="101" font-size="14" font-weight="bold" fill="#ffffff">🛣️ Safe Navigation</text>
  <text x="860" y="101" font-size="14" font-weight="600" fill="#9ca3af">📊 Analytics</text>

  <!-- Left Sidebar: Controls & Result comparison -->
  <rect x="40" y="140" width="370" height="500" rx="16" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="65" y="174" font-size="16" font-weight="bold" fill="#ffffff">Safe Corridor Navigation</text>
  <text x="65" y="196" font-size="12" fill="#9ca3af">Minimize tire damage and road impact</text>

  <!-- Selected Preset -->
  <rect x="65" y="215" width="320" height="40" rx="8" fill="#1f2937" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="80" y="240" font-size="12" font-weight="bold" fill="#f59e0b">Preset: Delhi to Agra (Yamuna Expy)</text>

  <!-- Start & Destination Badges -->
  <circle cx="80" cy="285" r="11" fill="#10b981"/>
  <text x="76" y="289" font-size="12" font-weight="bold" fill="#ffffff">A</text>
  <text x="100" y="289" font-size="13" font-weight="bold" fill="#ffffff">Origin: New Delhi (28.61, 77.20)</text>

  <circle cx="80" cy="325" r="11" fill="#ef4444"/>
  <text x="76" y="329" font-size="12" font-weight="bold" fill="#ffffff">B</text>
  <text x="100" y="329" font-size="13" font-weight="bold" fill="#ffffff">Destination: Agra (27.17, 78.00)</text>

  <!-- Comparison Results -->
  <rect x="65" y="360" width="320" height="260" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="390" font-size="14" font-weight="bold" fill="#ffffff">Route Comparison</text>
  <rect x="250" y="374" width="120" height="22" rx="11" fill="#10b98133" stroke="#10b981"/>
  <text x="264" y="390" font-size="11" font-weight="bold" fill="#10b981">77% Lower Risk</text>

  <!-- Safe Route Card (Selected) -->
  <rect x="80" y="410" width="290" height="60" rx="8" fill="#10b98122" stroke="#10b981" stroke-width="1.5"/>
  <text x="96" y="434" font-size="13" font-weight="bold" fill="#10b981">🛡️ RoadGuardian Safe Route</text>
  <text x="96" y="454" font-size="12" fill="#cbd5e1">210 km • 230 min • Only 1 minor crack</text>

  <!-- Direct Route Card -->
  <rect x="80" y="480" width="290" height="60" rx="8" fill="#111827" stroke="#475569"/>
  <text x="96" y="504" font-size="13" font-weight="bold" fill="#ef4444">⚠️ Direct Route (Standard)</text>
  <text x="96" y="524" font-size="12" fill="#9ca3af">198 km • 215 min • 7 severe potholes</text>

  <text x="80" y="580" font-size="12" fill="#10b981">✓ Recommendation: Take the safe bypass corridor</text>

  <!-- Right Map View: Trajectory Polyline Map -->
  <rect x="430" y="140" width="730" height="500" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Map Roads -->
  <path d="M480 200 C 600 240, 750 360, 1020 540" stroke="#ef4444" stroke-width="5" stroke-dasharray="10,6" fill="none" opacity="0.7"/>
  <path d="M480 200 C 530 260, 710 320, 840 400 S 980 480, 1020 540" stroke="#10b981" stroke-width="8" fill="none"/>

  <!-- High Risk Hazards Encountered on Direct Route -->
  <circle cx="680" cy="305" r="28" fill="#ef4444" fill-opacity="0.25"/>
  <circle cx="680" cy="305" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
  <text x="676" y="310" font-size="12" font-weight="bold" fill="#fff">!</text>

  <circle cx="820" cy="410" r="24" fill="#ef4444" fill-opacity="0.25"/>
  <circle cx="820" cy="410" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>

  <!-- Route Waypoints -->
  <g transform="translate(480, 200)">
    <circle cx="0" cy="0" r="16" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
    <text x="-5" y="5" font-size="14" font-weight="bold" fill="#fff">A</text>
  </g>
  <text x="440" y="175" font-size="13" font-weight="bold" fill="#ffffff">New Delhi (Start)</text>

  <g transform="translate(1020, 540)">
    <circle cx="0" cy="0" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
    <text x="-5" y="5" font-size="14" font-weight="bold" fill="#fff">B</text>
  </g>
  <text x="1000" y="575" font-size="13" font-weight="bold" fill="#ffffff">Agra (Destination)</text>

  <!-- Route Legend Badge -->
  <g transform="translate(860, 160)">
    <rect width="280" height="74" rx="10" fill="#0f172ae6" stroke="#334155"/>
    <line x1="20" y1="28" x2="60" y2="28" stroke="#10b981" stroke-width="6"/>
    <text x="75" y="32" font-size="12" font-weight="bold" fill="#10b981">RoadGuardian Safe Bypass</text>
    <line x1="20" y1="52" x2="60" y2="52" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,4"/>
    <text x="75" y="56" font-size="12" fill="#ef4444">Standard High-Risk Route</text>
  </g>
</svg>
